name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: mypy src/solwyn/
      - run: pytest tests/ -m unit -v --tb=short

  provider-surface-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - id: catalog
        run: |
          matrix=$(jq -c '{include: .include}' tests/provider_surface_intervals.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  provider-surface-inventory:
    needs: provider-surface-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.provider-surface-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install --upgrade "${{ matrix.packages }}"
      - run: >-
          python scripts/capture_surface_inventory.py
          --check
          --interval "${{ matrix.interval }}"
          --family "${{ matrix.family }}"
          --output-dir build/provider_surface_inventory
        env:
          AWS_EC2_METADATA_DISABLED: "true"
      - name: Verify generated surfaces are classified
        run: >-
          python scripts/export_surface_contract.py
          --check
          --reports-dir build/provider_surface_inventory
      - name: Upload provider surface inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: provider-surface-${{ matrix.family }}-${{ matrix.interval }}
          path: build/provider_surface_inventory
          if-no-files-found: error
          retention-days: 7

  integration:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -m integration -v --tb=short
        env:
          SOLWYN_TEST_API_URL: ${{ secrets.SOLWYN_TEST_API_URL }}
          SOLWYN_TEST_API_KEY: ${{ secrets.SOLWYN_TEST_API_KEY }}
          SOLWYN_TEST_PROJECT_ID: ${{ secrets.SOLWYN_TEST_PROJECT_ID }}
