name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC: catch provider latest-SDK drift on our schedule, not a contributor's

permissions:
  contents: read

concurrency:
  # Only PR revisions share a group. Other events have a unique group per run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: mypy src/solwyn/
      - run: >-
          pytest tests/ -m unit -v --tb=short
          --ignore=tests/unit/test_surface_canary.py
          --ignore=tests/integration/frameworks

  provider-surface-matrix:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - id: catalog
        run: |
          intervals=$(jq -c --arg event "$GITHUB_EVENT_NAME" '
            [.include[] | select($event != "schedule" or .interval == "latest")]
          ' tests/provider_surface_intervals.json)
          echo "Selected provider surface intervals ($GITHUB_EVENT_NAME):"
          jq -r '.[] | "\(.family)/\(.interval) (\(.packages))"' <<< "$intervals"
          # Keep normal batches over a minute; six weekly intervals share one runner.
          shards=3
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            shards=1
          fi
          matrix=$(jq -cn --argjson intervals "$intervals" --argjson shards "$shards" '
            {include: [range(0; $shards) as $shard | {
              shard: ($shard + 1),
              intervals: [$intervals | to_entries[] | select(.key % $shards == $shard) | .value]
            } | select(.intervals | length > 0)]}
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  provider-surface-inventory:
    name: provider-surface-inventory (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: provider-surface-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.provider-surface-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Check provider surface intervals in isolated environments
        run: >-
          python scripts/run_provider_surface_intervals.py
          --intervals-json "$SURFACE_INTERVALS"
          --output-dir build/provider_surface_inventory
        env:
          SURFACE_INTERVALS: ${{ toJSON(matrix.intervals) }}
      - name: Upload provider surface inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: provider-surface-${{ matrix.shard }}
          path: build/provider_surface_inventory
          if-no-files-found: error
          retention-days: 7

  integration:
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -m integration -v --tb=short
        env:
          SOLWYN_TEST_API_URL: ${{ secrets.SOLWYN_TEST_API_URL }}
          SOLWYN_TEST_API_KEY: ${{ secrets.SOLWYN_TEST_API_KEY }}
          SOLWYN_TEST_PROJECT_ID: ${{ secrets.SOLWYN_TEST_PROJECT_ID }}
