[project]
name = "solwyn"
dynamic = ["version"]
description = "AI Agent Control Plane SDK — hard spending caps, automatic failover, per-agent cost attribution"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Solwyn", email = "hello@solwyn.ai" }]
readme = "README.md"
keywords = ["ai", "llm", "observability", "cost-management", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0"]
anthropic = ["anthropic>=0.50"]
google = ["google-genai>=1.0"]
# Convenience only: the SDK never imports boto3 — Bedrock clients are
# detected duck-typed and responses are plain dicts. Bring your own boto3.
bedrock = ["boto3>=1.34"]
# Convenience only: the SDK never imports Together — native Together clients
# are admitted by the OpenAI-dialect compatibility adapter. Bring your own SDK.
together = ["together>=2.0"]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.157.0"]
all = ["solwyn[openai,anthropic,google,bedrock,together]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Lease wire tests mock the control-plane endpoints with respx. Listed
    # here AND in [dependency-groups] dev: CI installs `pip install -e ".[dev]"`
    # (this extra); local `uv sync` reads the dependency group.
    "respx>=0.21",
    # Test-only provider SDKs. Two sanctioned uses: the integration harness
    # constructs real wrapped clients against the fake provider server, and
    # tests/unit/test_real_sdk_*.py validate duck-typed detection/extraction
    # against genuine SDK objects (importorskip — each skips if absent).
    # All other unit tests must keep mocking; src/ never imports these.
    "openai>=2.0",
    "anthropic>=0.50",
    "google-genai>=1.0",
    "google-generativeai>=0.8.5",
    "together>=2.0",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://solwyn.ai"
Documentation = "https://docs.solwyn.ai"
Repository = "https://github.com/solwyn-ai/solwyn-python"
"Bug Tracker" = "https://github.com/solwyn-ai/solwyn-python/issues"
"Model Pricing" = "https://mpi.sh"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/solwyn"]
exclude = ["**/CLAUDE.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests that mock all external dependencies",
    "integration: marks tests as integration tests that may use real services",
    "framework_smoke: marks offline smoke tests against real framework packages",
    "performance: marks tests as performance tests",
    "stress: marks tests as long-running stress tests",
    "chaos: marks tests as chaos tests that intentionally cause failures",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.uv]
# Current CrewAI constrains MCP/OpenAI below the current OpenAI Agents stack.
# Resolve and execute their real-framework smoke environments independently so
# neither drift lane silently downgrades the other.
conflicts = [
    [
        { group = "frameworks" },
        { group = "frameworks-crewai" },
    ],
    [
        { group = "frameworks" },
        { extra = "crewai" },
    ],
]

[dependency-groups]
dev = [
    "respx>=0.21",
]
frameworks = [
    "langchain-openai",
    "langgraph",
    "openai-agents",
]
frameworks-crewai = [
    "crewai[litellm]>=0.157.0",
]
